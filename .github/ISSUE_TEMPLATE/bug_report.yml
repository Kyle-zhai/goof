name: Bug report
description: Something in Goof is broken or doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please describe how to reproduce it as clearly as you can. If a screenshot shows other people's names or messages, blur them first.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Screenshots or recordings help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on Figma in the Dashboard
        2. Switch to Figma and wait for the panel
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Goof version
      description: Dashboard › General › About
      placeholder: Goof 1.0 (1)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.1, Apple silicon
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Demo mode (no server)
        - My own server
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: Crash report (optional)
      description: If Goof crashed, find the report starting with Goof in the Console app › Crash Reports. The first 60 lines or so are enough.
      render: text
