name: Feature request
description: Something you'd like Goof to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve
      description: What's inconvenient today, and when you run into it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. Sketches or similar products are welcome.
    validations:
      required: true
  - type: markdown
    attributes:
      value: Features that read window contents, keystrokes or the screen, or that would let people see which apps someone uses, won't be accepted.
