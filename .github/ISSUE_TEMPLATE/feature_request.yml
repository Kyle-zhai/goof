name: 功能建议 / Feature request
description: 想让 Kuro 多做点什么
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在哪里不方便，什么时候会遇到。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 希望它怎么做。可以附上草图或者参考的产品。
    validations:
      required: true
  - type: markdown
    attributes:
      value: 需要读取窗口内容、按键或屏幕，或者会让别人看到某个人在用哪些应用的功能，不会被采纳。
