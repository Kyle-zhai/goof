name: App request
description: Ask Goof to add a room for an app
labels: [app-request]
body:
  - type: markdown
    attributes:
      value: |
        Goof only has rooms for work apps that nobody minds being seen using. Browsers, messaging and social, email, finance and payments, health, dating, password managers and VPNs won't be added.

        You can also open a PR yourself. It's a one-line change; see [Adding an app](https://github.com/Kyle-zhai/goof/blob/main/CONTRIBUTING.md#adding-an-app).
  - type: input
    id: name
    attributes:
      label: App name
      placeholder: Figma
    validations:
      required: true
  - type: input
    id: bundle
    attributes:
      label: Bundle id
      description: Run `osascript -e 'id of app "Figma"'` in Terminal to find it. Please list every edition (release, beta and so on).
      placeholder: com.figma.Desktop
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - AI
        - Code
        - Design
        - Productivity
        - Creative
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it suits a room
      description: Who mostly uses it, and what people in the room might talk about.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Being seen using this app doesn't give anything private away
          required: true
