name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: KuroCore tests
        run: swift test --package-path Packages/KuroCore

      - name: Generate project
        run: |
          brew install xcodegen
          ./scripts/bootstrap.sh

      - name: Build app
        shell: bash  # -eo pipefail, so a failed xcodebuild fails the step
        run: |
          xcodebuild -project Kuro.xcodeproj -scheme Kuro -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build build | xcbeautify

      # Renders the real UI offscreen (see App/Kuro/System/SnapshotRenderer.swift).
      - name: Render screenshots
        id: snapshots
        continue-on-error: true
        shell: bash
        run: |
          perl -e 'alarm 120; exec @ARGV' build/Build/Products/Debug/Kuro.app/Contents/MacOS/Kuro --snapshot | tee snapshot.log
          dir=$(sed -n 's/^KURO_SNAPSHOTS=//p' snapshot.log | tail -1)
          test -n "$dir"
          mkdir -p snapshots
          cp "$dir"/*.png snapshots/
          ls -la snapshots

      - name: Upload screenshots
        if: steps.snapshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: snapshots/*.png

      # Small JPEG copies in the log, for reviewing UI changes without downloading artifacts.
      - name: Print screenshots
        if: steps.snapshots.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          for f in snapshots/*.png; do
            name=$(basename "$f" .png)
            sips -s format jpeg -s formatOptions 55 -Z 760 "$f" --out "/tmp/$name.jpg" >/dev/null
            echo "=== BEGIN $name ==="
            base64 -i "/tmp/$name.jpg" | fold -w 2000
            echo "=== END $name ==="
          done
