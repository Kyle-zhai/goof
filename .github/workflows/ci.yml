name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: GoofCore tests
        run: swift test --package-path Packages/GoofCore

      - name: Generate project
        run: |
          brew install xcodegen
          ./scripts/bootstrap.sh

      - name: Build app
        shell: bash  # -eo pipefail, so a failed xcodebuild fails the step
        run: |
          xcodebuild -project Goof.xcodeproj -scheme Goof -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build build | xcbeautify

      # Renders the real UI offscreen (see App/Goof/System/SnapshotRenderer.swift),
      # with overlay scroll bars as on a Mac with a trackpad.
      - name: Render screenshots
        id: snapshots
        continue-on-error: true
        shell: bash
        run: |
          perl -e 'alarm 120; exec @ARGV' build/Build/Products/Debug/Goof.app/Contents/MacOS/Goof \
            --snapshot -AppleShowScrollBars WhenScrolling | tee snapshot.log
          dir=$(sed -n 's/^GOOF_SNAPSHOTS=//p' snapshot.log | tail -1)
          test -n "$dir"
          mkdir -p snapshots
          cp "$dir"/*.png snapshots/
          ls -la snapshots

      - name: Show crash report
        if: steps.snapshots.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          report=""
          for _ in $(seq 30); do
            report=$(ls -t ~/Library/Logs/DiagnosticReports/Goof*.ips 2>/dev/null | head -1)
            [ -n "$report" ] && break
            sleep 1
          done
          if [ -z "$report" ]; then echo "No crash report found"; exit 0; fi
          python3 - "$report" <<'EOF' | xcrun swift-demangle --simplified
          import json, sys
          text = open(sys.argv[1]).read()
          body = json.loads(text.partition("\n")[2])
          print("exception:", json.dumps(body.get("exception")))
          print("termination:", (body.get("termination") or {}).get("indicator"))
          for key, lines in (body.get("asi") or {}).items():
              print("message:", key, lines)
          images = body.get("usedImages", [])
          def show(title, frames):
              print(title)
              for i, frame in enumerate(frames[:60]):
                  index = frame.get("imageIndex", -1)
                  image = images[index].get("name", "?") if 0 <= index < len(images) else "?"
                  symbol = frame.get("symbol") or hex(frame.get("imageOffset", 0))
                  print(f"{i:3} {image:30} {symbol} + {frame.get('symbolLocation', 0)}")
          if body.get("lastExceptionBacktrace"):
              show("exception backtrace:", body["lastExceptionBacktrace"])
          threads = body.get("threads", [])
          faulting = body.get("faultingThread", 0)
          if faulting < len(threads):
              show(f"thread {faulting}:", threads[faulting].get("frames", []))
          EOF

      - name: Upload screenshots
        if: steps.snapshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: snapshots/*.png

      # Small JPEG copies in the log, for reviewing UI changes without downloading artifacts.
      - name: Print screenshots
        if: steps.snapshots.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          for f in snapshots/*.png; do
            name=$(basename "$f" .png)
            sips -s format jpeg -s formatOptions 55 -Z 760 "$f" --out "/tmp/$name.jpg" >/dev/null
            echo "=== BEGIN $name ==="
            base64 -i "/tmp/$name.jpg" | fold -w 2000
            echo "=== END $name ==="
          done

  # Temporary: prints the full-resolution README screenshots, one per job log.
  readme-shots:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [panel-scroll, panel-stack, panel-capsule, dashboard-apps, dashboard-apps-dark,
                dashboard-appearance, dashboard-appearance-dark, dashboard-profile, dashboard-profile-dark]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: snapshots
      - name: Print ${{ matrix.image }}
        run: |
          f="snapshots/${{ matrix.image }}.png"
          ls -la "$f"
          echo "=== BEGIN png-${{ matrix.image }} ==="
          base64 -w 4000 "$f"
          echo "=== END png-${{ matrix.image }} ==="
