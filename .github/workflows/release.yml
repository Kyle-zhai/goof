name: Release

# Push a tag like v0.1.0 to build Goof and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Test
        run: swift test --package-path Packages/GoofCore

      - name: Generate project
        run: |
          brew install xcodegen
          ./scripts/bootstrap.sh

      - name: Build (universal, ad-hoc signed)
        shell: bash
        run: |
          xcodebuild -project Goof.xcodeproj -scheme Goof -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build | xcbeautify

      - name: Package
        shell: bash
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/Goof.app "Goof-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "Goof-${GITHUB_REF_NAME}.zip" | tee "Goof-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Goof-${GITHUB_REF_NAME}.zip" "Goof-${GITHUB_REF_NAME}.zip.sha256" \
            --title "Goof ${GITHUB_REF_NAME}" --notes-file .github/release-notes.md --generate-notes
